services:
  mysql:
    build: .
    image: computienda-mysql:semana6
    container_name: computienda-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root2026
      MYSQL_DATABASE: computienda
      MYSQL_USER: computienda
      MYSQL_PASSWORD: computienda2026
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot2026"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
